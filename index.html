<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>St. Paul's Visual Experience — Production &amp; Projection Mapping Portal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style id="portal-lock-styles">
    :root {
      --bg-dark: #0b0d13;
      --bg-card: #131722;
      --border: #262e42;
      --gold: #e5b85c;
      --gold-light: #ffe08a;
      --text-main: #eef2f9;
      --text-muted: #9aa5b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
    }
    .lock-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(229, 184, 92, 0.14), transparent 55%),
        radial-gradient(circle at 50% 85%, rgba(77, 166, 255, 0.07), transparent 50%),
        #0b0d13;
    }
    .lock-card {
      width: 100%;
      max-width: 440px;
      background: rgba(19, 23, 34, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(229, 184, 92, 0.32);
      border-radius: 18px;
      padding: 36px 32px 30px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(229, 184, 92, 0.08);
      text-align: center;
    }
    .lock-icon-ring {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(229, 184, 92, 0.22) 0%, rgba(229, 184, 92, 0.05) 70%);
      border: 1px solid rgba(229, 184, 92, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      box-shadow: 0 0 24px rgba(229, 184, 92, 0.18);
    }
    .lock-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--gold-light);
      background: rgba(229, 184, 92, 0.12);
      border: 1px solid rgba(229, 184, 92, 0.35);
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 12px;
    }
    .lock-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    .lock-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .lock-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }
    .lock-label {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold-light);
      margin-bottom: 4px;
      display: block;
    }
    .lock-input-wrap {
      position: relative;
    }
    .lock-input {
      width: 100%;
      padding: 13px 44px 13px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0e17;
      color: #ffffff;
      font-size: 0.96rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .lock-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(229, 184, 92, 0.18);
    }
    .lock-toggle-pw {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.82rem;
      padding: 4px 6px;
    }
    .lock-toggle-pw:hover {
      color: var(--gold-light);
    }
    .lock-remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .lock-remember input {
      accent-color: var(--gold);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
    .lock-error {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      text-align: center;
      font-weight: 500;
    }
    .lock-error.visible {
      display: block;
    }
    .lock-btn {
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      border: 1px solid #f3c86b;
      background: linear-gradient(135deg, #d8a642 0%, #b58020 100%);
      color: #0b0d13;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      margin-top: 4px;
    }
    .lock-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .lock-footer {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(38, 46, 66, 0.7);
      font-size: 0.74rem;
      color: #687387;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
  <style id="portal-main-styles"></style>
</head>
<body>
  <div id="lockScreen" class="lock-wrapper">
    <div class="lock-card">
      <div class="lock-icon-ring">🏛️</div>
      <span class="lock-badge">Protected Production Portal</span>
      <h1 class="lock-title">St. Paul’s Visual Experience</h1>
      <p class="lock-subtitle">
        10-Minute Architectural Projection Mapping, Full-Room Synced Sanctuary Visualizer &amp; Animation Handoff Package
      </p>

      <form id="unlockForm" class="lock-form" onsubmit="handleUnlock(event)">
        <div>
          <label class="lock-label" for="passInput">Enter Access Password</label>
          <div class="lock-input-wrap">
            <input
              id="passInput"
              type="password"
              class="lock-input"
              placeholder="Enter password..."
              autocomplete="current-password"
              required
            />
            <button type="button" class="lock-toggle-pw" onclick="togglePwVisibility()" id="pwToggleBtn">Show</button>
          </div>
        </div>

        <label class="lock-remember">
          <input id="rememberCheck" type="checkbox" checked />
          <span>Remember this browser</span>
        </label>

        <div id="errorMsg" class="lock-error">
          Incorrect password. Please try again.
        </div>

        <button type="submit" class="lock-btn">
          🔓 Unlock Production Portal
        </button>
      </form>

      <div class="lock-footer">
        <span>🔒 AES-256-CBC Client-Side Encryption</span>
        <span>Videometry · St. Paul’s</span>
      </div>
    </div>
  </div>

    function togglePwVisibility() {
      const input = document.getElementById("passInput");
      const btn = document.getElementById("pwToggleBtn");
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Hide";
      } else {
        input.type = "password";
        btn.textContent = "Show";
      }
    }

    function decryptWithPassword(rawPassword) {
      const candidates = [rawPassword, rawPassword.toLowerCase()];
      for (const password of candidates) {
        try {
          const salt = CryptoJS.enc.Hex.parse(ENC_PAYLOAD.salt);
          const iv = CryptoJS.enc.Hex.parse(ENC_PAYLOAD.iv);
          const ctWords = CryptoJS.enc.Base64.parse(ENC_PAYLOAD.ct);

          const derived = CryptoJS.PBKDF2(password, salt, {
            keySize: 512 / 32,
            iterations: ENC_PAYLOAD.iter,
            hasher: CryptoJS.algo.SHA256
          });

          const aesKey = CryptoJS.lib.WordArray.create(derived.words.slice(0, 8), 32);
          const hmacKey = CryptoJS.lib.WordArray.create(derived.words.slice(8, 16), 32);

          const dataToMac = iv.clone().concat(ctWords);
          const computedTag = CryptoJS.HmacSHA256(dataToMac, hmacKey).toString(CryptoJS.enc.Hex);
          if (computedTag !== ENC_PAYLOAD.tag) {
            continue;
          }

          const decrypted = CryptoJS.AES.decrypt(
            { ciphertext: ctWords },
            aesKey,
            { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
          );
          const jsonStr = decrypted.toString(CryptoJS.enc.Utf8);
          if (!jsonStr) continue;
          return JSON.parse(jsonStr);
        } catch (e) {
          continue;
        }
      }
      return null;
    }

    function renderUnlockedPayload(data) {
      window.lockPortal = function() {
        try {
          localStorage.removeItem(STORAGE_KEY);
          sessionStorage.removeItem(STORAGE_KEY);
        } catch (e) {}
        window.location.reload();
      };

      const mainStyleEl = document.getElementById("portal-main-styles");
      if (mainStyleEl && data.headCss) {
        mainStyleEl.textContent = data.headCss;
      }

      const container = document.createElement("div");
      container.innerHTML = data.bodyHtml;

      const scripts = Array.from(container.querySelectorAll("script"));
      scripts.forEach(s => s.parentNode.removeChild(s));

      document.body.innerHTML = container.innerHTML;

      scripts.forEach(oldScript => {
        const newScript = document.createElement("script");
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      });
    }

    function handleUnlock(e) {
      if (e) e.preventDefault();
      const pass = document.getElementById("passInput").value.trim();
      const remember = document.getElementById("rememberCheck").checked;
      const errEl = document.getElementById("errorMsg");

      const data = decryptWithPassword(pass);
      if (!data) {
        errEl.classList.add("visible");
        return;
      }

      errEl.classList.remove("visible");
      try {
        const normalizedPass = pass.toLowerCase();
        if (remember) {
          localStorage.setItem(STORAGE_KEY, btoa(unescape(encodeURIComponent(normalizedPass))));
        } else {
          sessionStorage.setItem(STORAGE_KEY, btoa(unescape(encodeURIComponent(normalizedPass))));
        }
      } catch (err) {}

      renderUnlockedPayload(data);
    }

    (function autoCheck() {
      try {
        const savedB64 = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
        if (savedB64) {
          const savedPass = decodeURIComponent(escape(atob(savedB64)));
          const data = decryptWithPassword(savedPass);
          if (data) {
            renderUnlockedPayload(data);
            return;
          }
        }
      } catch (e) {}
      const input = document.getElementById("passInput");
      if (input) input.focus();
    })();
  </script>
</body>
